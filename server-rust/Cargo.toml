[package]
name = "silex-server"
version = "0.1.0"
edition = "2021"
description = "Silex website builder server - Rust implementation"
license = "AGPL-3.0-or-later"
authors = ["Silex Labs Foundation"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time/dates
chrono = { version = "0.4", features = ["serde"] }

# Versioning websites, without a git program on the machine
git2 = { version = "0.21.0", default-features = false }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"

# Embedded frontend assets (optional, for single-binary distribution)
rust-embed = { version = "8", optional = true }

[features]
default = []
embed-frontend = ["rust-embed"]

[dev-dependencies]
# Calling the router in tests without opening a socket
tower = { version = "0.5", features = ["util"] }
