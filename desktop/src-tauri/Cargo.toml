[package]
name = "silex-desktop"
version = "0.1.0"
edition = "2021"
description = "Silex website builder - desktop app"
license = "AGPL-3.0-or-later"
authors = ["Silex Labs Foundation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# One Silex at a time: the websites and their git repositories are one shared
# directory, which two running apps cannot both write
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP (Model Context Protocol) support
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "0.15", features = ["server", "transport-streamable-http-server", "transport-io"] }
# Required as a direct dependency: the JsonSchema derive expands to ::schemars paths
schemars = "1"

# Open files/folders in the OS default application
open = "5"

# Platform-specific directories (for telemetry consent before Tauri init)
dirs = "6"

# Anonymous install id (persistent UUID for telemetry user count)
uuid = { version = "1", features = ["v4"] }

# Look for the programs of the integrations in PATH, with the extensions
# Windows expects (.exe, .cmd, .bat)
which = "8"

# Error tracking / telemetry (GlitchTip / Sentry-compatible)
sentry = { version = "0.35", features = ["tracing"] }

# What a program writes to be read in a terminal, made readable anywhere else:
# a real parser rather than a guess at where an escape sequence ends
strip-ansi-escapes = "0.2"

# Silex server as a library, with the editor compiled into it
silex-server = { path = "../../server-rust", features = ["embed-frontend"] }

# The dashboard, compiled into the binary. The one the hosted Silex serves is
# not this one, so the server crate has no reason to carry it
rust-embed = "8"

# Stop a whole process tree when an integration hangs: killing git alone leaves
# the ssh it started behind
[target.'cfg(unix)'.dependencies]
libc = "0.2"
