[package]
name = "silex-desktop"
version = "0.1.0"
edition = "2021"
description = "Silex website builder - desktop app"
license = "AGPL-3.0-or-later"
authors = ["Silex Labs Foundation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# One Silex at a time: the websites and their git repositories are one shared
# directory, which two running apps cannot both write
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["make", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP (Model Context Protocol) support
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.8", features = ["server", "transport-streamable-http-server", "transport-io"] }

# Open files/folders in the OS default application
open = "5"

# Deleting a website moves it to the trash of this computer
trash = "5"

# The language of this computer, for the dialogs that open before, or
# without, the dashboard
sys-locale = "0.3"

# Platform-specific directories (for telemetry consent before Tauri init)
dirs = "7"

# Anonymous install id (persistent UUID for telemetry user count)
uuid = { version = "1", features = ["v4"] }

# Look for the programs of the integrations in PATH, with the extensions
# Windows expects (.exe, .cmd, .bat)
which = "8"

# Error tracking / telemetry (GlitchTip / Sentry-compatible)
sentry = { version = "0.49", features = ["tracing", "tower-axum-matched-path"] }

# The programs Silex installs itself come as a .tar.gz, or a .zip on Windows,
# checked against the checksums their project publishes
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# What a program writes to be read in a terminal, made readable anywhere else:
# a real parser rather than a guess at where an escape sequence ends
strip-ansi-escapes = "0.2"

# Silex server as a library, with the editor compiled into it
silex-server = { path = "../../server-rust", features = ["embed-frontend"] }

# Reading the remotes of a website at every save without starting a git
git2.workspace = true

# Zola, whose crates are named site and errors
site = { git = "https://github.com/getzola/zola", tag = "v0.23.6" }
errors = { git = "https://github.com/getzola/zola", tag = "v0.23.6" }
gqlfreez = { git = "https://github.com/lexoyo/gqlfreez", tag = "v0.2.1" }

# The dashboard, compiled into the binary. The one the hosted Silex serves is
# not this one, so the server crate has no reason to carry it
rust-embed = "8"

# Stop a whole process tree when an integration hangs: killing git alone leaves
# the ssh it started behind
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The PATH as installers write it, which a running app does not get
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
