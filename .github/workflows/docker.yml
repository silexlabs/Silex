name: Docker image

# Builds and publishes the silexlabs/silex-platform image (root Dockerfile) —
# the same image used by v3.silex.me and the CapRover one-click app. Single source of
# truth, replacing the legacy silexlabs/silex-platform repo autobuild.
# Requires repo/org secrets DOCKER_USERNAME / DOCKER_PASSWORD.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Patch version from tag
        run: ./scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Every v* tag publishes its versioned image. Prerelease tags (v3.9.0-canary.1)
      # move :canary, stable tags move :latest — a prerelease never touches :latest.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          TAGS="silexlabs/silex-platform:${V}"
          if [[ "$V" == *-* ]]; then
            TAGS="${TAGS},silexlabs/silex-platform:canary"
          else
            TAGS="${TAGS},silexlabs/silex-platform:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
